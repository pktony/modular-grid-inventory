<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modular Grid Inventory</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071110; color: #f4f7f6; font: 16px/1.5 system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    #unity-canvas { width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); display: block; outline-offset: -3px; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #071110e8; }
    #status[hidden] { display: none; }
    progress { width: min(260px, 75vw); margin: 16px auto; accent-color: #b9c7ff; }
    a { color: #c4ceff; padding: 12px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Interactive inventory demo. Mouse and keyboard required."></canvas>
  <div id="status" role="status" aria-live="polite"><p id="message">Loading inventory…</p><progress id="progress" max="1" value="0"></progress><a id="video" hidden href="https://youtu.be/cyUhx101tj8" target="_blank" rel="noopener">Watch demonstration</a></div>
  <script>
    window.inventoryConfig = {
      loader: "Build/{{{ LOADER_FILENAME }}}",
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "pktony",
      productName: "Modular Grid Inventory",
      productVersion: "0.1.0"
    };
  </script>
  <script src="player.js"></script>
</body>
</html>
